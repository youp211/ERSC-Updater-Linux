name: Release

# Manually triggered release. Runs on GitHub's servers, so it can create the
# tag and publish the release using the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / version (e.g. 2.2)"
        required: true
        default: "2.2"
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity-check script version against the requested tag
        run: |
          script_version="$(grep -oP '^#\s*Version:\s*\K.*' ersc-update.sh || true)"
          echo "Script reports version: '${script_version}'"
          echo "Requested release tag:  '${{ inputs.tag }}'"
          if [[ -n "$script_version" && "$script_version" != "${{ inputs.tag }}" ]]; then
            echo "::warning::ersc-update.sh version '${script_version}' does not match release tag '${{ inputs.tag }}'."
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists — nothing to do."
            exit 0
          fi

          # Build the release. Create the tag at the exact commit this workflow
          # ran against. Prefer curated notes if a file exists for this version,
          # otherwise fall back to auto-generated notes.
          args=(--target "$GITHUB_SHA" --title "Version ${TAG}")
          notes_file=".github/releases/${TAG}.md"
          if [[ -f "$notes_file" ]]; then
            echo "Using curated notes from ${notes_file}"
            args+=(--notes-file "$notes_file")
          else
            echo "No notes file at ${notes_file}; auto-generating notes."
            args+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "${args[@]}"

          # Attach the script itself so users can download it straight from the release.
          gh release upload "$TAG" ersc-update.sh --clobber

          echo "Published release:"
          gh release view "$TAG" --json tagName,name,url --jq '"\(.name) (\(.tagName)) -> \(.url)"'
